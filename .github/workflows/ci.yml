name: ci

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build-firmware:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment:
          - esp32-s3-devkitm-1
          - esp32dev-uart1
          - heltec-wifi-lora-32-v3
          - heltec-wifi-lora-32-v4

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Cache PlatformIO
        uses: actions/cache@v5
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: ${{ runner.os }}-platformio-${{ matrix.environment }}-${{ hashFiles('platformio.ini', 'src/**', 'include/**', 'scripts/**') }}
          restore-keys: |
            ${{ runner.os }}-platformio-${{ matrix.environment }}-
            ${{ runner.os }}-platformio-

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build ${{ matrix.environment }}
        run: pio run --environment ${{ matrix.environment }}

  docs-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Install DocFX
        run: dotnet tool update --global docfx

      - name: Add global .NET tools to PATH
        run: echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Build docs site
        run: docfx docs/docfx.json

      - name: Upload docs preview artifact
        uses: actions/upload-artifact@v7
        with:
          name: docs-site-preview
          path: docs/_site

  release-preview:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run semantic-release dry-run
        run: npx semantic-release --dry-run --no-ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  python-unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Run embed library unit tests
        run: python -m unittest discover -s test -p "test_*_unit.py" -v

  python-integration-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Run embed library integration tests
        run: python -m unittest discover -s test -p "test_*_integration.py" -v

  e2e-offline-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run offline dashboard e2e
        run: npm run test:e2e:offline

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: offline-dashboard-e2e-report
          path: |
            playwright-report/
            test-results/
